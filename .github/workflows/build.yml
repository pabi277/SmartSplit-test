name: Build SplitSmart

# Every push gets built and tested in the cloud.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK and run the tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon

      - name: Upload APK (install this on your phone)
        uses: actions/upload-artifact@v4
        with:
          name: SplitSmart-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Even when tests FAIL, keep the report so you can read what went wrong.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/
          if-no-files-found: ignore
